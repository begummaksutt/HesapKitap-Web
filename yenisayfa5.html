<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tavuk Döner - HesapKitap</title>
    <link rel="stylesheet" href="style4.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body>
    <nav class="navbar">
        <div class="nav-left">
            <img src="logo/hklogo2.png" alt="HesapKitap Logo" class="logo">
        </div>
        <div class="nav-right">
            <button class="login-button">Giriş Yap</button>
        </div>
    </nav>

    <div class="container">
        <div class="menu-container">
            <div class="menu-box">
                <h2 class="menu-title">Balta Burger</h2>
                    <div class="menu-image">
                    <img src="logo/hamburger1.png" >
                </div>
                <p class="menu-subtitle">Hamburger</p>
                <button class="price-button">450₺</button>
            </div>

            <div class="menu-box">
                <h2 class="menu-title">Gürkan Burger</h2>
                <div class="menu-image">
                    <img src="logo/hamburger2.png" >
                </div>
                <p class="menu-subtitle">Hamburger</p>
                <button class="price-button">390₺</button>
            </div>

            <div class="menu-box">
                <h2 class="menu-title">Öküz Burger</h2> 
                <div class="menu-image">
                    <img src="logo/hamburger3.png" >
                </div>
                <p class="menu-subtitle">Hamburger</p>
                <button class="price-button">470₺</button>
            </div>
        </div>
    </div>

</html>
