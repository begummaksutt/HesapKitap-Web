<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HesapKitap - Şifremi Unuttum</title>
    <link rel="stylesheet" href="/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body>
    <div class="container">
        <div class="forgot-password-form">
            <h2>Şifremi Unuttum</h2>
            <p class="form-description">Kullanıcı adınızı girerek yeni şifre oluşturabilirsiniz.</p>
            <form id="resetPasswordForm">
                <div class="form-group">
                    <label for="username">Kullanıcı Adı</label>
                    <input type="text" id="username" name="username" required>
                </div>
                <div class="form-group">
                    <label for="newPassword">Yeni Şifre</label>
                    <input type="password" id="newPassword" name="newPassword" required>
                </div>
                <button type="submit" class="reset-button">Şifreyi Sıfırla</button>
            </form>
            <p class="back-to-login">
                <a href="/yeni-sayfa1.html"><i class="fas fa-arrow-left"></i> Giriş Sayfasına Dön</a>
            </p>
        </div>
    </div>

    <script>
        document.getElementById('resetPasswordForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const formData = {
                username: document.getElementById('username').value,
                newPassword: document.getElementById('newPassword').value
            };

            try {
                const response = await fetch('/api/reset-password', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify(formData)
                });

                const data = await response.json();
                
                if (response.ok) {
                    alert('Şifreniz başarıyla güncellendi!');
                    window.location.href = '/yeni-sayfa1.html';
                } else {
                    alert(data.message || 'Şifre sıfırlama sırasında bir hata oluştu');
                }
            } catch (error) {
                console.error('Şifre sıfırlama hatası:', error);
                alert('Şifre sıfırlama sırasında bir hata oluştu');
            }
        });
    </script>
</body>
</html>
