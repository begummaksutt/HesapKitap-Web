<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tavuk Döner - HesapKitap</title>
    <link rel="stylesheet" href="style2.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body>
    <nav class="navbar">
        <div class="nav-left">
            <img src="logo/hklogo2.png" alt="HesapKitap Logo" class="logo">
        </div>
        <div class="nav-right">
            <button class="login-button">Giriş Yap</button>
        </div>

    <div class="container">

                <h2 class="menu-title">Maydonoz Döner</h2>

            </div>

            <div class="menu-box">
                <h2 class="menu-title">Öncü Döner</h2>

            </div>

            <div class="menu-box">
                <h2 class="menu-title">Küncü Döner</h2>
